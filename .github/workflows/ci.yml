name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # every script in this repo is TypeScript: no Python, no Python config, no setup-python.
      # The same check scripts/check.sh runs, run first so a Python file fails before npm ci.
      - name: No Python
        run: bash scripts/no-python.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # no ~/.pi/agent on the runner: the smoke test runs pi on an empty config
      - run: scripts/check.sh
        env:
          PI_EXTRAS_SMOKE_CONFIG: empty
